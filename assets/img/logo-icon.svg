<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020818"/>
      <stop offset="50%" style="stop-color:#051a3a"/>
      <stop offset="100%" style="stop-color:#020c20"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8d8ff"/>
      <stop offset="20%" style="stop-color:#e8f4ff"/>
      <stop offset="40%" style="stop-color:#6ab0e8"/>
      <stop offset="60%" style="stop-color:#c8e8ff"/>
      <stop offset="80%" style="stop-color:#4a90d4"/>
      <stop offset="100%" style="stop-color:#a0c8f0"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="50%" style="stop-color:#a0d4ff;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0"/>
    </radialGradient>
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="innerClip">
      <rect x="20" y="20" width="472" height="472" rx="76" ry="76"/>
    </clipPath>
  </defs>

  <!-- Outer neon glow ring -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96"
        fill="none" stroke="#00aaff" stroke-width="4" opacity="0.5" filter="url(#outerGlow)"/>

  <!-- Metallic outer border -->
  <rect x="4" y="4" width="504" height="504" rx="94" ry="94" fill="url(#metalGrad)"/>

  <!-- Dark background -->
  <rect x="12" y="12" width="488" height="488" rx="86" ry="86" fill="url(#bgGrad)"/>

  <!-- Cyan ambient glow -->
  <ellipse cx="256" cy="256" rx="220" ry="220" fill="url(#cyanGlow)"/>

  <!-- Subtle circuit lines -->
  <g opacity="0.07" stroke="#00cfff" stroke-width="1" fill="none">
    <line x1="40" y1="80" x2="120" y2="80"/><line x1="120" y1="80" x2="120" y2="40"/>
    <line x1="392" y1="80" x2="472" y2="80"/><line x1="392" y1="80" x2="392" y2="40"/>
    <line x1="40" y1="432" x2="120" y2="432"/><line x1="120" y1="432" x2="120" y2="472"/>
    <line x1="392" y1="432" x2="472" y2="432"/><line x1="392" y1="432" x2="392" y2="472"/>
    <circle cx="120" cy="40" r="3" fill="#00cfff"/>
    <circle cx="392" cy="40" r="3" fill="#00cfff"/>
    <circle cx="120" cy="472" r="3" fill="#00cfff"/>
    <circle cx="392" cy="472" r="3" fill="#00cfff"/>
  </g>

  <!-- YOUR LOGO.PNG centered -->
  <image href="logo.png" x="12" y="12" width="488" height="488"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Glossy top shine overlay -->
  <rect x="12" y="12" width="488" height="244" rx="86" ry="86"
        fill="url(#glossGrad)" clip-path="url(#innerClip)"/>

  <!-- Inner metallic ring -->
  <rect x="12" y="12" width="488" height="488" rx="86" ry="86"
        fill="none" stroke="url(#metalGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Cyan corner accent dots -->
  <circle cx="48" cy="48" r="4" fill="#00e5ff" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="464" cy="48" r="4" fill="#00e5ff" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="48" cy="464" r="4" fill="#00e5ff" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="464" cy="464" r="4" fill="#00e5ff" opacity="0.8" filter="url(#softGlow)"/>

  <!-- Cyan corner brackets -->
  <g fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" opacity="0.7">
    <polyline points="30,65 20,65 20,30 55,30"/>
    <polyline points="457,30 492,30 492,65"/>
    <polyline points="20,447 20,482 55,482"/>
    <polyline points="457,482 492,482 492,447"/>
  </g>
</svg>
